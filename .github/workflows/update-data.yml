name: Update Tour de France Data

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 min all day; script exits early on non-stage days
  workflow_dispatch:
    inputs:
      force_drama:
        description: 'Force-regenerate the "what to watch for" blurb even if one already exists for the current stage/phase'
        type: boolean
        default: false
      force_recap:
        description: 'Force-regenerate the post-stage recap even if one already exists for the most recently concluded stage'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Fetch drama blurb
        run: python scripts/fetch_drama.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_DRAMA: ${{ github.event.inputs.force_drama }}

      - name: Fetch stage recap
        run: python scripts/fetch_recap.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RECAP: ${{ github.event.inputs.force_recap }}

      - name: Commit if changed
        run: |
          git config user.name  "TdF Data Bot"
          git config user.email "actions@github.com"
          git add data/standings.json data/stage-results/ data/drama.json data/recap.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update TdF data [skip ci]"
            git push
          fi
