<style>

<script>
const TERRAIN_LABEL = { flat:'Flat', hilly:'Hilly', mountain:'Mountains', itt:'Individual Time Trial', ttt:'Team Time Trial', rest:'Rest Day' };

function ymd(d){ return d.toISOString().slice(0,10); }
function terrainBadge(type, label){
  return `<span class="terrain terrain-${type}">${label}</span>`;
}
function climbChips(climbs){
  if(!climbs || !climbs.length) return '';
  return `<div class="climb-list">${climbs.map(c => {
    const cat = c.category ? `<span class="cat cat-${c.category}">${c.category === 'HC' ? 'HC' : 'Cat '+c.category}</span>` : '';
    const detail = c.lengthKm ? ` · ${c.lengthKm}km${c.gradient ? ' @ '+c.gradient+'%':''}` : '';
    return `<span class="climb-chip">${cat}${c.name}${detail}</span>`;
  }).join('')}</div>`;
}

function buildStageProfile(stage, profiles){
  const url = profiles && profiles[String(stage.n)];
  if(!url) return '';
  return `<div class="profile-img-wrap"><img src="${url}" alt="Elevation profile for Stage ${stage.n}"/></div>`;
}

function jerseyCard(label, dotClass, row, isTime, tabKey){
  const href = `tdf-standings.html?tab=${tabKey}`;
  if(!row) return `<a class="jersey-card" href="${href}"><div class="jersey-label"><span class="dot ${dotClass}"></span>${label}</div><div class="jersey-detail">—</div></a>`;
  const detail = isTime ? (row.gap && row.gap !== '-' ? row.gap : 'Leader') : (row.points || row.times || '');
  return `<a class="jersey-card" href="${href}">
    <div class="jersey-label"><span class="dot ${dotClass}"></span>${label}</div>
    <div class="jersey-rider">${row.rider}</div>
    <div class="jersey-detail">${row.team} · ${detail}</div>
  </a>`;
}

async function tryFetch(url){
  try { const r = await fetch(url); if(!r.ok) return null; return await r.json(); } catch(e){ return null; }
}

// The stage whose start time is next in the future — this is what the
// countdown targets, and doubles as the "stage day" phase driver: on the
// morning of a stage this naturally resolves to today's own stage, and
// once its start time passes, to tomorrow's.
function pickCountdownTarget(stages, stageTimes, now){
  const candidates = stages
    .filter(s => s.n > 0)
    .map(s => {
      const t = (stageTimes && stageTimes[String(s.n)]) || '13:00';
      return { ...s, startDt: new Date(`${s.date}T${t}:00+02:00`) };
    })
    .filter(s => s.startDt > now)
    .sort((a,b) => a.startDt - b.startDt);
  return candidates[0] || null;
}

// Calendar-day label ("Today"/"Tomorrow"/full date) for a given instant in
// a given IANA timezone (or the browser's local zone if timeZone is
// omitted) — compares actual calendar dates in that zone, not raw
// elapsed hours, so it can't mislabel near a midnight boundary.
function dayLabel(instant, now, timeZone){
  const opts = timeZone ? { timeZone } : {};
  const dateKey = d => d.toLocaleDateString('en-CA', opts); // YYYY-MM-DD
  const diffDays = Math.round((new Date(dateKey(instant) + 'T00:00:00Z') - new Date(dateKey(now) + 'T00:00:00Z')) / 86400000);
  if(diffDays === 0) return 'Today';
  if(diffDays === 1) return 'Tomorrow';
  return instant.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', ...opts });
}

function formatStartMeta(target, now){
  const parisLabel = dayLabel(target.startDt, now, 'Europe/Paris');
  const timeStr = target.startDt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'Europe/Paris' });

  // Viewer's own timezone equivalent — no explicit timeZone option, so
  // this uses whatever the browser's local timezone is.
  const localLabel = dayLabel(target.startDt, now, null);
  const localTimeStr = target.startDt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

  const paris = `<span class="countdown-relative">${parisLabel}</span> at ${timeStr} (Paris time)`;
  const local = `<span class="countdown-relative">${localLabel}</span> ${localTimeStr} (local time)`;
  return `Stage start: ${paris} &nbsp;|&nbsp; ${local}`;
}

// Bumped on every re-render so a countdown ticker from a previous render
// (before the 60s data refresh replaced the DOM) stops itself instead of
// stacking up alongside the new one.
let renderGen = 0;

function tickCountdown(targetDt, gen){
  if(gen !== renderGen) return; // a newer render has taken over
  const boxes = { d: document.getElementById('cd-days'), h: document.getElementById('cd-hours'), m: document.getElementById('cd-mins'), s: document.getElementById('cd-secs') };
  if(!boxes.d) return; // card no longer in DOM (navigated away)
  const diff = Math.max(0, targetDt - new Date());
  const totalSec = Math.floor(diff / 1000);
  boxes.d.textContent = Math.floor(totalSec / 86400);
  boxes.h.textContent = String(Math.floor((totalSec % 86400) / 3600)).padStart(2,'0');
  boxes.m.textContent = String(Math.floor((totalSec % 3600) / 60)).padStart(2,'0');
  boxes.s.textContent = String(totalSec % 60).padStart(2,'0');
  if(diff > 0) setTimeout(() => tickCountdown(targetDt, gen), 1000);
}

function elapsedLabel(startDt, now){
  const totalMin = Math.floor((now - startDt) / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// ── Live in-race tracker ──────────────────────────────────────────────
// Data comes from ASO's own live telemetry API (racecenter.letour.fr —
// same publisher as the rest of this site's scrape, just a different,
// undocumented endpoint). It has no CORS headers, so the browser can't
// fetch it directly — TDF_PROXY is a small Cloudflare Worker that just
// relays it with CORS added, so this can poll every 10s instead of
// waiting on the 10-minute GitHub Actions cron that updates everything
// else. Fill in the real *.workers.dev URL after deploying
// cloudflare/tdf-telemetry-proxy.js.
const TDF_PROXY = 'https://tdf-live.mattt-100.workers.dev';
const TDF_YEAR = 2026;

async function fetchRoster(){
  const cacheKey = `tdf_roster_${TDF_YEAR}`;
  const cached = sessionStorage.getItem(cacheKey);
  if(cached){ try { return JSON.parse(cached); } catch(e){} }
  try {
    const [riders, teams] = await Promise.all([
      fetch(`${TDF_PROXY}/allCompetitors-${TDF_YEAR}`).then(r => r.ok ? r.json() : null),
      fetch(`${TDF_PROXY}/team-${TDF_YEAR}`).then(r => r.ok ? r.json() : null),
    ]);
    if(!riders) return null;
    const teamById = {};
    (teams || []).forEach(t => { if(t._id) teamById[t._id] = t; });
    const riderByBib = {};
    riders.forEach(item => {
      if(!('bib' in item)) return;
      const teamId = (item.$team || '').includes(':') ? item.$team.split(':')[1] : item.$team;
      const team = teamById[teamId];
      riderByBib[item.bib] = { name: `${item.firstname || ''} ${item.lastname || ''}`.trim(), team: team ? team.name : '' };
    });
    const roster = { riderByBib };
    sessionStorage.setItem(cacheKey, JSON.stringify(roster));
    return roster;
  } catch(e){ return null; }
}

async function fetchTelemetry(){
  try {
    const r = await fetch(`${TDF_PROXY}/telemetryCompetitor-${TDF_YEAR}`);
    if(!r.ok) return null;
    const data = await r.json();
    return Array.isArray(data) ? data[0] : data;
  } catch(e){ return null; }
}

// Debug fixtures for local testing ahead of the Worker being deployed and
// ahead of the next live stage day (the real feed's Riders[] is empty
// between stages) — enabled via ?mockLive=1. Mirrors the inferred ASO
// schema: three groups, jerseys split across them (polka up the road
// with the breakaway, the other three back in the peloton).
function mockTelemetry(stageLengthKm){
  // Spacing within each cluster is an absolute km delta (well under the
  // 0.15km clustering threshold) rather than a fraction of stage length —
  // a fractional delta scales with stage length and can silently exceed
  // the threshold on a long stage, splitting an intended group apart.
  const breakawayKm = stageLengthKm * 0.320;
  const pelotonKm = stageLengthKm * 0.345;
  const groupettoKm = stageLengthKm * 0.365;
  const riders = [
    { Bib: 61, kmToFinish: +breakawayKm.toFixed(2), kph: 42, Gradient: -1.2, degC: 18, kphWind: 14 }, // O'Connor — polka dot
    { Bib: 62, kmToFinish: +(breakawayKm+0.02).toFixed(2), kph: 41, Gradient: -1.2, degC: 18, kphWind: 14 },
    { Bib: 63, kmToFinish: +(breakawayKm+0.04).toFixed(2), kph: 41, Gradient: -1.2, degC: 18, kphWind: 14 },
    { Bib: 64, kmToFinish: +(breakawayKm+0.06).toFixed(2), kph: 42, Gradient: -1.2, degC: 18, kphWind: 14 },
    { Bib: 1,  kmToFinish: +pelotonKm.toFixed(2), kph: 39, Gradient: -1.2, degC: 18, kphWind: 14 }, // Pogačar — yellow
    { Bib: 11, kmToFinish: +(pelotonKm+0.02).toFixed(2), kph: 39, Gradient: -1.2, degC: 18, kphWind: 14 }, // Vingegaard
    { Bib: 31, kmToFinish: +(pelotonKm+0.04).toFixed(2), kph: 38, Gradient: -1.2, degC: 18, kphWind: 14 }, // Evenepoel — white
    { Bib: 91, kmToFinish: +(pelotonKm+0.06).toFixed(2), kph: 39, Gradient: -1.2, degC: 18, kphWind: 14 }, // Girmay — green
  ];
  for(let i = 0; i < 114; i++) riders.push({ Bib: 100+i, kmToFinish: +(pelotonKm+0.08+i*0.005).toFixed(2), kph: 38, Gradient: -1.2, degC: 18, kphWind: 14 });
  for(let i = 0; i < 22; i++) riders.push({ Bib: 300+i, kmToFinish: +(groupettoKm+i*0.01).toFixed(2), kph: 34, Gradient: -1.2, degC: 18, kphWind: 14 });
  return { RaceStatus: true, YGPW: [1, 91, 61, 31], Riders: riders }; // yellow, green, polka, white
}
function mockRoster(){
  const names = {
    1: ["Pogačar", 'UAE Team Emirates XRG'], 11: ['Vingegaard', 'Team Visma | Lease a Bike'],
    31: ['Evenepoel', 'Soudal Quick-Step'], 91: ['Girmay', 'Intermarché'], 61: ["O'Connor", 'Jayco AlUla'],
  };
  const riderByBib = {};
  Object.keys(names).forEach(bib => { riderByBib[bib] = { name: names[bib][0], team: names[bib][1] }; });
  return { riderByBib };
}

// Sort by distance-to-finish and cluster riders within 0.15km of their
// neighbor into the same group — ASO's feed gives relative road position,
// not lat/lon, so this is how "who's riding with whom" is derived.
function clusterGroups(riders){
  const sorted = [...riders].sort((a,b) => a.kmToFinish - b.kmToFinish);
  const groups = [];
  sorted.forEach(r => {
    const last = groups[groups.length - 1];
    if(last && Math.abs(r.kmToFinish - last.riders[last.riders.length-1].kmToFinish) < 0.15){
      last.riders.push(r);
    } else {
      groups.push({ riders: [r] });
    }
  });
  // Already front-to-back (ascending kmToFinish) since it was built by
  // walking the sorted array in order.
  return groups.map(g => ({
    riders: g.riders,
    kmToFinish: Math.min(...g.riders.map(r => r.kmToFinish)),
    avgKph: g.riders.reduce((s,r) => s + (r.kph||0), 0) / g.riders.length,
  }));
}

// Guarantees jersey holders are never hidden behind the "+N" truncation —
// pulled into the visible slice ahead of it if they wouldn't otherwise
// make the cut, rather than a fixed visible-name count regardless of who
// is actually riding in that group.
function groupNamesHtml(group, roster, ygpwByBib){
  const maxVisible = 3;
  const named = group.riders.map(r => {
    const info = (roster && roster.riderByBib[r.Bib]) || { name: `#${r.Bib}` };
    return { name: info.name || `#${r.Bib}`, jersey: ygpwByBib.get(r.Bib) };
  });
  const jerseyRiders = named.filter(r => r.jersey);
  const others = named.filter(r => !r.jersey);
  const visible = jerseyRiders.concat(others).slice(0, Math.max(maxVisible, jerseyRiders.length));
  const hiddenCount = named.length - visible.length;
  const parts = visible.map(r => r.jersey ? `${r.name}<span class="jdot ${r.jersey}"></span>` : r.name);
  return parts.join(', ') + (hiddenCount > 0 ? ` +${hiddenCount}` : '');
}

// Groups occupy the middle 70% of the bar (15% padding reserved on each
// side) rather than a fixed km buffer, so tight bunches get tight padding
// and strung-out groups get proportionally more room.
function computeZoomWindow(groups, stageLengthKm){
  const elapsed = groups.map(g => stageLengthKm - g.kmToFinish);
  const minE = Math.min(...elapsed), maxE = Math.max(...elapsed);
  const span = Math.max(maxE - minE, 0.3); // floor so one tight cluster still gets a visible window
  const pad = (span / 0.7) * 0.15;
  return { windowMin: Math.max(0, minE - pad), windowMax: Math.min(stageLengthKm, maxE + pad) };
}

function renderLiveTrackerHtml(stage, telemetry, roster){
  const stageLengthKm = stage.distanceKm;
  const groups = clusterGroups(telemetry.Riders); // already front-to-back
  if(!groups.length) return null;

  const jerseyClasses = ['dot-yellow','dot-green','dot-red','dot-white'];
  const ygpwByBib = new Map();
  (telemetry.YGPW || []).forEach((bib, i) => { if(bib != null && jerseyClasses[i]) ygpwByBib.set(bib, jerseyClasses[i]); });

  const { windowMin, windowMax } = computeZoomWindow(groups, stageLengthKm);
  const windowSpan = Math.max(windowMax - windowMin, 0.01);
  const pctOfElapsed = elapsedKm => ((elapsedKm - windowMin) / windowSpan) * 100;

  const mainIdx = groups.reduce((best, g, i) => g.riders.length > groups[best].riders.length ? i : best, 0);
  const mainKm = groups[mainIdx].kmToFinish;
  const leadKm = groups[0].kmToFinish;

  const dotsHtml = groups.map((g, i) => {
    const left = pctOfElapsed(stageLengthKm - g.kmToFinish).toFixed(2);
    const isMain = g === groups[mainIdx];
    const kind = isMain ? 'peloton' : (g.kmToFinish < mainKm ? 'breakaway' : 'groupetto');
    const size = Math.max(5, Math.min(9, 4 + Math.sqrt(g.riders.length)));
    const jerseysHere = g.riders.map(r => ygpwByBib.get(r.Bib)).filter(Boolean);
    const ticks = jerseysHere.map((cls, ti) => {
      const tickLeft = ((ti - (jerseysHere.length-1)/2) * 9).toFixed(1);
      return `<span class="live-jtick ${cls}" style="margin-left:${tickLeft}px"></span>`;
    }).join('');
    return `<div class="live-group-marker" data-gidx="${i}" style="left:${left}%">
      ${ticks}
      <span class="live-group-dot ${kind}" style="width:${size}px;height:${size}px;margin-left:${(-size/2).toFixed(1)}px"></span>
    </div>`;
  }).join('');

  const rowsHtml = groups.map((g, i) => {
    const isMain = g === groups[mainIdx];
    const kind = isMain ? 'peloton' : (g.kmToFinish < mainKm ? 'breakaway' : 'groupetto');
    let gapLabel, gapClass = '';
    if(isMain){
      gapLabel = 'Peloton';
    } else {
      const gapKm = Math.abs(g.kmToFinish - mainKm);
      const gapSec = g.avgKph > 0 ? Math.round(gapKm / g.avgKph * 3600) : 0;
      const mm = Math.floor(gapSec/60), ss = String(gapSec%60).padStart(2,'0');
      gapLabel = `≈${kind === 'breakaway' ? '-' : '+'}${mm}:${ss}`;
      if(kind === 'breakaway') gapClass = 'lead';
    }
    return `<div class="live-group-row ${kind}" data-gidx="${i}">
      <div class="live-group-meta"><div class="live-group-gap ${gapClass}">${gapLabel}</div><div class="live-group-count">${g.riders.length} riders</div></div>
      <div class="live-group-names">${groupNamesHtml(g, roster, ygpwByBib)}</div>
      <div class="live-group-speed">${g.avgKph.toFixed(1)}<small>km/h</small></div>
    </div>`;
  }).join('');

  const doneWidth = pctOfElapsed(stageLengthKm - leadKm).toFixed(2);
  const windowLeftPct = ((windowMin / stageLengthKm) * 100).toFixed(2);
  const windowWidthPct = (((windowMax - windowMin) / stageLengthKm) * 100).toFixed(2);
  const startLabel = windowMin < 1 ? 'Start' : `${windowMin.toFixed(0)} km from start`;
  const finishLabel = (stageLengthKm - windowMax) < 1 ? 'Finish' : `${(stageLengthKm - windowMax).toFixed(0)} km from finish`;
  const w = telemetry.Riders[0] || {};

  return `
    <div class="live-km-row"><div class="cd-num">${leadKm.toFixed(1)}</div><div class="cd-label">km to go</div></div>
    <div class="live-track-wrap">
      <div class="live-minimap"><div class="live-minimap-window" style="left:${windowLeftPct}%;width:${windowWidthPct}%"></div></div>
      <div class="live-track"><span class="live-track-done" style="width:${doneWidth}%"></span>${dotsHtml}</div>
      <div class="live-track-labels"><span>${startLabel}</span><span>${(windowMax-windowMin).toFixed(1)} km shown</span><span>${finishLabel}</span></div>
    </div>
    <div class="live-chips">
      <div class="live-chip">Gradient <b>${w.Gradient != null ? w.Gradient.toFixed(1)+'%' : '—'}</b></div>
      <div class="live-chip">${w.degC != null ? w.degC.toFixed(0)+'°C' : '—'}, wind <b>${w.kphWind != null ? w.kphWind.toFixed(0)+' kph' : '—'}</b></div>
      <div class="live-chip">${groups.length} group${groups.length===1?'':'s'} on the road</div>
    </div>
    <div class="live-groups">${rowsHtml}</div>
  `;
}

// Fast poll loop for the tracker card only — independent of the page's
// 60s full re-render, which would be both too slow for "live" and would
// fight the countdown-ticker teardown/rebuild happening on that cycle.
let liveTrackerTimer = null;
function stopLiveTrackerPolling(){
  if(liveTrackerTimer){ clearInterval(liveTrackerTimer); liveTrackerTimer = null; }
}
function startLiveTrackerPolling(stage, gen, mockLive){
  stopLiveTrackerPolling();
  liveTrackerTimer = setInterval(async () => {
    if(gen !== renderGen){ stopLiveTrackerPolling(); return; }
    if(document.visibilityState !== 'visible') return; // don't hammer the Worker from a backgrounded tab
    const slot = document.getElementById('live-tracker-slot');
    if(!slot){ stopLiveTrackerPolling(); return; }
    let telemetry, roster;
    if(mockLive){ telemetry = mockTelemetry(stage.distanceKm); roster = mockRoster(); }
    else { telemetry = await fetchTelemetry(); roster = telemetry && telemetry.RaceStatus ? await fetchRoster() : null; }
    if(!telemetry || !telemetry.RaceStatus || !telemetry.Riders || !telemetry.Riders.length){
      stopLiveTrackerPolling();
      renderDashboard(); // stage likely concluded or the feed dropped — pick up the new phase now, not on the next 60s tick
      return;
    }
    slot.innerHTML = renderLiveTrackerHtml(stage, telemetry, roster);
  }, 10000);
}

async function renderDashboard(){
  renderGen++;
  const myGen = renderGen;
  stopLiveTrackerPolling();
  const scrollY = window.scrollY;

  // Local-testing hook: ?mockLive=1 forces the live-tracker state on with
  // fixture data, since the real feed is empty except during an actual
  // live stage. See mockTelemetry()/mockRoster() above.
  const mockLive = [...new URLSearchParams(location.search).keys()].some(k => k.toLowerCase() === 'mocklive');

  const route = await tryFetch('data/route.json');
  const standings = await tryFetch('data/standings.json');
  const profiles = await tryFetch('data/profiles.json');
  const stageTimes = await tryFetch('data/stage-times.json');
  const drama = await tryFetch('data/drama.json');
  const recap = await tryFetch('data/recap.json');
  const app = document.getElementById('app');
  if(!route){ app.innerHTML = '<div class="loading">Could not load race data.</div>'; return; }

  const stages = route.stages;
  const first = stages[0], last = stages[stages.length-1];
  const now = new Date();
  const todayStr = ymd(now);

  const todayStage = stages.find(s => s.date === todayStr);
  const isRestToday = !!(todayStage && todayStage.type === 'rest');
  let realTodayStage = (todayStage && !isRestToday) ? todayStage : null;

  // A stage's finish classification table is empty on letour.fr while the
  // race is still on the road and jumps straight to the full field once
  // it closes — so "result has a real field size" is a reliable signal
  // for "this stage has actually concluded", unlike just checking the date.
  let todayResult = null;
  if(realTodayStage) todayResult = await tryFetch(`data/stage-results/${realTodayStage.n}.json`);
  let todayConcluded = !!(todayResult && todayResult.result && todayResult.result.length >= 20);

  let todayStartDt = null;
  if(realTodayStage){
    const t = (stageTimes && stageTimes[String(realTodayStage.n)]) || '13:00';
    todayStartDt = new Date(`${realTodayStage.date}T${t}:00+02:00`);
  }
  if(mockLive){
    realTodayStage = stages.find(s => s.n === 11) || stages.find(s => s.n > 0 && s.type !== 'rest');
    todayStartDt = new Date(now.getTime() - 90*60000);
    todayConcluded = false;
  }
  const todayLive = mockLive || !!(realTodayStage && todayStartDt && now >= todayStartDt && !todayConcluded);

  // Real ASO telemetry only exists while a stage is physically rolling —
  // todayLive above is a clock guess, this is the authoritative check.
  let liveTelemetry = null, liveRoster = null;
  if(todayLive){
    if(mockLive){ liveTelemetry = mockTelemetry(realTodayStage.distanceKm); liveRoster = mockRoster(); }
    else {
      liveTelemetry = await fetchTelemetry();
      if(liveTelemetry && liveTelemetry.RaceStatus && liveTelemetry.Riders && liveTelemetry.Riders.length) liveRoster = await fetchRoster();
    }
  }
  const liveTrackerActive = !!(todayLive && liveTelemetry && liveTelemetry.RaceStatus && liveTelemetry.Riders && liveTelemetry.Riders.length);
  // Covers both "hasn't started yet" and "on the road right now" — in
  // both cases today's own stage stays the focus rather than jumping
  // ahead to tomorrow's countdown.
  const focusIsToday = !!(realTodayStage && !todayConcluded);

  let phase;
  if(todayStr < first.date) phase = 'countdown';
  else if(todayStr > last.date) phase = 'complete';
  else if(isRestToday) phase = 'rest';
  else if(focusIsToday) phase = 'stage';
  else phase = 'between'; // no stage today, or today's already concluded — look ahead

  const countdownTarget = pickCountdownTarget(stages, stageTimes, now);
  const spotlight = focusIsToday ? realTodayStage : countdownTarget;
  // Match on stage number only, not phase: the same upcoming stage can
  // legitimately be labeled 'between'/'rest' (looking ahead from an
  // earlier day) and then 'stage' (once its own day arrives) without the
  // editorial content needing to change — requiring both fields matched
  // was hiding a perfectly valid blurb right at that day-rollover instant.
  const dramaValid = !!(spotlight && drama && drama.stage === spotlight.n);

  let html = '';

  if(todayLive){
    html += `<div class="countdown-card">
      <div class="live-badge"><span class="live-dot"></span>Live</div>
      <div class="countdown-title">${realTodayStage.start} → ${realTodayStage.finish}</div>
      <div class="countdown-subtitle">${realTodayStage.distanceKm} km · ${TERRAIN_LABEL[realTodayStage.type]}</div>
      <div id="live-tracker-slot">
        ${liveTrackerActive
          ? renderLiveTrackerHtml(realTodayStage, liveTelemetry, liveRoster)
          : `<div class="live-status">Stage ${realTodayStage.n} is underway — on the road for ${elapsedLabel(todayStartDt, now)}</div>`}
      </div>
      ${dramaValid ? `<div class="drama-blurb"><div class="drama-label">What to watch for</div>${drama.text}</div>` : ''}
    </div>`;
  } else if(countdownTarget){
    html += `<div class="countdown-card">
      <div class="countdown-badge">Stage ${countdownTarget.n} / 21</div>
      <div class="countdown-title">${countdownTarget.start} → ${countdownTarget.finish}</div>
      <div class="countdown-subtitle">${countdownTarget.distanceKm} km · ${TERRAIN_LABEL[countdownTarget.type]}</div>
      <div class="countdown-grid">
        <div class="countdown-box"><div class="cd-num" id="cd-days">–</div><div class="cd-label">Days</div></div>
        <div class="countdown-box"><div class="cd-num" id="cd-hours">–</div><div class="cd-label">Hours</div></div>
        <div class="countdown-box"><div class="cd-num" id="cd-mins">–</div><div class="cd-label">Mins</div></div>
        <div class="countdown-box"><div class="cd-num" id="cd-secs">–</div><div class="cd-label">Secs</div></div>
      </div>
      <div class="countdown-meta">${formatStartMeta(countdownTarget, now)}</div>
      ${dramaValid ? `<div class="drama-blurb"><div class="drama-label">What to watch for</div>${drama.text}</div>` : ''}
    </div>`;
  } else {
    const phaseTitle = phase === 'complete' ? 'Tour Complete' : 'Tour de France 2026';
    const phaseSub = phase === 'complete' ? `Champs-Élysées, ${last.date}` : '';
    html += `<div class="phase-banner"><div><div class="phase-title">${phaseTitle}</div><div class="phase-sub">${phaseSub}</div></div></div>`;
  }

  // Jersey snapshot
  if(standings){
    html += `<div class="section-label">Current Jerseys — after Stage ${standings.stage}</div><div class="jersey-grid">`;
    html += jerseyCard('General Classification', 'dot-yellow', standings.gc[0], true, 'gc');
    html += jerseyCard('Points', 'dot-green', standings.points[0], false, 'points');
    html += jerseyCard('Mountains', 'dot-red', standings.mountains[0], false, 'mountains');
    html += jerseyCard('Youth', 'dot-white', standings.youth[0], true, 'youth');
    html += `</div>`;
  }

  // Today's / next stage card — same spotlight stage the topper is
  // focused on, so this section and the topper never disagree.
  if(spotlight){
    html += `<div class="section-label">${focusIsToday ? "Today's Stage" : 'Next Stage'}</div>`;
    html += `<div class="stage-card">
      ${terrainBadge(spotlight.type, TERRAIN_LABEL[spotlight.type])}
      <div class="stage-route">Stage ${spotlight.n} · ${spotlight.start} → ${spotlight.finish}</div>
      <div class="stage-meta">${spotlight.distanceKm} km · ${spotlight.date}</div>
      ${buildStageProfile(spotlight, profiles)}
      ${climbChips(spotlight.climbs)}
      <div class="storyline">${spotlight.storyline}</div>
    </div>`;
  }

  // Most recent finished stage's result — today's own stage once it has
  // actually concluded (result data available), otherwise the last
  // previous-day stage.
  const mostRecentPast = stages.filter(s => s.n > 0 && s.date < todayStr).sort((a,b)=>b.n-a.n)[0];
  const resultStage = todayConcluded ? realTodayStage : mostRecentPast;
  if(resultStage){
    const result = todayConcluded ? todayResult : await tryFetch(`data/stage-results/${resultStage.n}.json`);
    const recapValid = !!(recap && recap.stage === resultStage.n);
    html += `<div class="section-label">Stage ${resultStage.n} Result — ${resultStage.start} → ${resultStage.finish}</div>`;
    if(result && result.result && result.result.length){
      html += `<div class="stage-card">`;
      if(recapValid) html += `<div class="drama-blurb" style="margin-top:0;padding-top:0;border-top:none;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #222"><div class="drama-label">What happened</div>${recap.text}</div>`;
      result.result.slice(0,5).forEach(r => {
        html += `<div class="result-row">
          <div class="result-rank">${r.rank}</div>
          <div><div class="result-rider">${r.rider}</div><div class="result-team">${r.team}</div></div>
          <div style="flex:1"></div>
          <div class="result-gap">${r.gap && r.gap !== '-' ? r.gap : r.times || ''}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="stage-card"><div class="storyline">${resultStage.storyline}</div></div>`;
    }
  }

  html += `<a class="card-link" href="tdf-route.html"><div class="t">Full Route →</div><div class="s">All 21 stages, climbs, and terrain</div></a>`;
  html += `<a class="card-link" href="tdf-standings.html"><div class="t">Full Standings →</div><div class="s">GC, Points, Mountains, Youth, Teams</div></a>`;

  app.innerHTML = html;
  window.scrollTo(0, scrollY);
  if(!todayLive && countdownTarget) tickCountdown(countdownTarget.startDt, myGen);
  if(liveTrackerActive) startLiveTrackerPolling(realTodayStage, myGen, mockLive);
}

// Hovering a group's row highlights its marker on the bar and vice versa.
// Delegated on document (rather than bound to the tracker's own elements)
// so it keeps working across every innerHTML replacement — the 60s full
// re-render and the 10s tracker-only patch both swap out the actual
// nodes, but never need to re-attach this listener.
function setLiveGroupHover(gidx, on){
  document.querySelectorAll(`.live-group-row[data-gidx="${gidx}"], .live-group-marker[data-gidx="${gidx}"]`)
    .forEach(el => el.classList.toggle('hover-active', on));
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest('.live-group-row, .live-group-marker');
  if(el) setLiveGroupHover(el.dataset.gidx, true);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest('.live-group-row, .live-group-marker');
  if(el) setLiveGroupHover(el.dataset.gidx, false);
});

renderDashboard();
setInterval(renderDashboard, 60000); // re-fetch + re-render every 60s
</script>
</body>
</html>
